set_room:
  name: Set a room's temperature
  description: Set a simulated room's temperature at once (test only).
  fields:
    room:
      name: Room
      required: true
      selector:
        text:
    temperature:
      name: Temperature
      required: true
      selector:
        number:
          min: -20
          max: 40
          step: 0.01
          unit_of_measurement: "°C"
ramp_room:
  name: Change a room's temperature gently
  description: Move a simulated room's temperature in a straight line over some minutes (test only).
  fields:
    room:
      name: Room
      required: true
      selector:
        text:
    temperature:
      name: Temperature
      required: true
      selector:
        number:
          min: -20
          max: 40
          step: 0.01
          unit_of_measurement: "°C"
    minutes:
      name: Minutes
      required: true
      selector:
        number:
          min: 0.1
          max: 1440
          step: 0.1
set_outdoor:
  name: Set the outdoor temperature
  description: Move the simulated outdoor mean, at once or over some minutes, and its daily swing (test only).
  fields:
    mean:
      name: Mean
      required: true
      selector:
        number:
          min: -30
          max: 40
          step: 0.1
          unit_of_measurement: "°C"
    swing:
      name: Daily swing
      required: false
      selector:
        number:
          min: 0
          max: 15
          step: 0.1
          unit_of_measurement: "°C"
    minutes:
      name: Minutes
      required: false
      selector:
        number:
          min: 0
          max: 1440
          step: 1
reset:
  name: Reset the simulation
  description: Put the outdoors back to the configured state and stop the ramps; unless rooms is false, also the rooms, the heaters and the boiler (test only).
  fields:
    rooms:
      name: Rooms too
      required: false
      default: true
      selector:
        boolean:
